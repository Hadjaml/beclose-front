# Local containerized run of the frontend, mirroring the docker-compose
# convention used in ../Beclose (named services, healthchecks). This repo has
# no database of its own (frontend-only, see AGENTS.md "Scope") — it only
# containerizes the Next.js app itself. Compose is not required for `npm run
# dev`; it exists to validate the production image locally.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bewise-app:local
    container_name: bewise-app
    ports:
      - "3000:3000"
    environment:
      # No backend URL is wired yet (see README, "Dépendances backend
      # restantes"). Add NEXT_PUBLIC_API_BASE_URL here once the backend is
      # reachable — never a secret, see AGENTS.md.
      NODE_ENV: production
    healthcheck:
      # 127.0.0.1, not "localhost": Alpine's musl resolver tries the ::1
      # (IPv6) entry in /etc/hosts first, and the Next.js server only binds
      # IPv4 (0.0.0.0:3000, see Dockerfile ENV HOSTNAME) — "localhost"
      # health-checks fail with "Connection refused" even though the app is
      # up and reachable on IPv4 the whole time. Found 2026-09-23 diagnosing
      # a container Rochinel thought was broken; it was just healthcheck's
      # own false negative (see conventions.md).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
